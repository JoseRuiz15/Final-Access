<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Acces</title>
    <!-- Script oficial de Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--css por si acaso xd-->
    <link rel="stylesheet" href="css/style.css">
    <!-- Fuente pixelart -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen overflow-hidden">

    <main class="relative min-h-screen" style="font-family: 'goldman', cursive;">

        <!-- Pantalla de Inicio -->
        <section id="home-screen">
            <!-- Fondo -->
            <img src="img/Fondo Final-Acces.png" alt="Fondo Final-Acces"
                class="absolute inset-0 w-full h-full object-cover" />
            <!-- Contenido -->    
            <div id="home-content" class="relative z-10 flex items-end justify-center min-h-screen">

                <!-- Efecto de luz -->
                <div class="absolute bottom-28 flex justify-center w-full">
                    <div class="w-56 h-20 rounded-full bg-[#9747FF] opacity-30 blur-3xl"></div>
                </div>

                 <!-- Botón iniciar -->
                <button id="start-button" class=" text-[10px] relative z-20 bg-[#9747FF] text-black pixel-font py-3 px-8 rounded-lg mb-24 transition-all duration-300 hover:text-white hover:shadow-[0_0_25px_#9747FF] hover:scale-105">
                    INICIAR
                </button>    
            </div>
        </section>
        <!-- Fin Pantalla de Inicio -->

        <!-- Pantalla Login -->
        <section id="login-screen" class="hidden">
            <!--fondo login-->
            <img src="img/sesion.png" alt="pantalla de login" 
            class="absolute inset-0 w-full h-full object-cover" />
            <!--cuadro-->
            <div class="relative z-10 flex items-center justify-center min-h-screen">

        <div class="w-[510px] h-[560px]
                    bg-black/50
                    rounded-3xl
                    backdrop-blur-sm
                    ">
                <!--texto-->
                <h2 class=" pixel-font text-4xl text-[#E41F1F] text-center mt-[50px]">INICIO DE SESION</h2>
                <!--USUARIO-->
                <div class="bg-black/30 w-[150px]  rounded ml-10 mt-10 w-[151px] h-[21px] flex items-center justify-center">
                   <label for="username-input" class="pixel-font text-white text-[10px]">USUARIO:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="text" id="username-input" class="text-white login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] flex justify-center items-center">
                </div>
                <!--CONTRASEÑA-->
                <div class="bg-black/30 w-[150px]  rounded ml-10 mt-10 w-[151px] h-[21px] flex items-center justify-center">
                   <label for="next-step-btn" class="pixel-font text-white text-[10px]">CONTRASEÑA:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="password" id="password" class="login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] text-white">
                </div>
                <!--boton inicio de sesion-->
                <div class="flex justify-center items-center">
                    <button class="text-[10px] pixel-font bg-black/30 text-white ronded h-10 w-[350px] mt-10 rounded-[5px] transition-all duration-300 hover:text-white hover:shadow-[0_0_40px_#00AAFF] hover:bg-[#00AAFF] hover:scale-105">
                        INGRESAR
                    </button>
                </div>
                <!--registro de cuenta-->
                 <div class="flex justify-center items-center mt-[10px]">
                    <p class=" pixel-font text-white text-[15px]">¿No tienes una cuenta?</p>
                 </div>
                 <!--registrarse-->
                 <div class="flex justify-center items-center">
                    <button  id="record-button" class="pixel-font text-[#1FD0E4] text-[15px]">registrate aqui</button>
                 </div>

          </div>

        </div>
        </section>

        <!--registro-->
        <section id="record-screen" class="hidden">
            <!--fondo registro-->
            <img src="img/sesion.png" alt="pantalla de login" 
            class="absolute inset-0 w-full h-full object-cover" />
             <!--cuadro registro-->
             <div class="relative z-10 flex items-center justify-center min-h-screen">
             
             <div class="w-[510px] h-[700px]
                    bg-black/50
                    rounded-3xl
                    backdrop-blur-sm
                    ">
                    <!--texto-->
                <h2 class=" pixel-font text-4xl text-[#E41F1F] text-center mt-[50px]">INICIO DE SESION</h2>
                 <!--USUARIO-->
                <div class="bg-black/30 w-[150px]  rounded ml-10 mt-10 w-[151px] h-[21px] flex items-center justify-center">
                   <label for="username-input" class="pixel-font text-white text-[10px]">USUARIO:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="text" id="username-input" class="text-white login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] flex justify-center items-center">
                </div>
                <!--email-->
                <div class="bg-black/30 w-[150px]  rounded ml-10 mt-10 w-[151px] h-[21px] flex items-center justify-center">
                   <label for="username-input" class="pixel-font text-white text-[10px]">EMAIL:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="email" class="text-white login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] flex justify-center items-center">
                </div>
                <!--contraseña-->
                <div class="bg-black/30 rounded ml-10 mt-10 w-[151px] h-[21px] flex items-center justify-center">
                   <label for="next-step-btn" class="pixel-font text-white text-[10px]">CONTRASEÑA:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="password"  id="password" class="login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] text-white">
                </div>
                <!--confirmar contraseña-->
                <div class="bg-black/30 w-[200px] h-[30px] rounded ml-10 mt-10  flex items-center justify-center">
                   <label for="next-step-btn" class="pixel-font text-white text-[9px]">CONFIRMAR CONTRASEÑA:</label>
                </div>
                <div class="mt-[20px] flex items-center justify-center">
                    <input type="password" id="confirmPassword" class=" login-input w-[425px] bg-[#675462]/30 rounded-[5px] h-[30px] text-white">
                </div>
                <!--boton de registro-->
                <div class="flex justify-center items-center">
                    <button id="regist-button" class="text-[10px] pixel-font bg-black/30 text-white ronded h-10 w-[350px] mt-[20px] rounded-[5px] transition-all duration-300 hover:text-white hover:shadow-[0_0_40px_#00AAFF] hover:bg-[#00AAFF] hover:scale-105"> <!--el oneclick es para obligar a que considan la contraseña-->
                        REGISTRARSE
                    </button>
                </div>

             </div>
             </div>
        </section>

        <!-- Fin Pantalla Login -->

         <!-- inicio pantalla codigo-->
          <section id="code-screen" class="hidden">
            <!--fondo codigo-->
            <img src="img/sesion.png" alt="pantalla de login" 
            class="absolute inset-0 w-full h-full object-cover" />
            <!--cuadro de verificacion de codigo-->
             <div class="relative z-10 flex items-center justify-center min-h-screen">
                <div class="w-[510px] h-[700px]
                    bg-black/50
                    rounded-3xl
                    backdrop-blur-sm">
                </div>
             </div>

          </section>


    </main>
    





    <!-- Enlace del Javascript -->
    <script src="js/main.js"></script>
</body>

</html>
